[package]
name = "kalos"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[lib]
path = "src/lib.rs"

[[bin]]
name = "kalos"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
petgraph = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
ordered-float = { version = "5", features = ["serde"] }
sha2 = "0.10"
ureq = "3"
url = "2"
flate2 = "1"
tar = "0.4"
wasmtime = { version = "31", default-features = false, features = ["cranelift", "runtime"] }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
wat = "1"
