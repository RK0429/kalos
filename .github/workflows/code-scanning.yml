name: Code Scanning

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  kalos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run kalos official action with SARIF upload
        uses: ./
        with:
          upload-sarif: true
