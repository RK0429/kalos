# Wave 9-1 quality gates and determinism check only.
# Performance benchmark job (Wave 9-4) is not yet implemented and will be
# added as a separate job when REQ-NF-002 baselines are established.
name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo check
        run: cargo check --all-features
      - name: cargo test
        run: cargo test
      - name: cargo clippy
        run: cargo clippy --all-features --all-targets -- -D warnings

  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: cargo test determinism
        run: cargo test --test determinism -- --nocapture
