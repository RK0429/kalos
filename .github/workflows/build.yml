# Wave 9-1 cross-platform artifact build workflow only.
# Full release/publish automation (GitHub Releases, checksums, provenance, etc.)
# and the official GitHub Action wrapper (Wave 9-2) remain blocked on the
# managed bundle/bootstrap slice and are intentionally excluded here.

name: Build Artifacts

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_suffix: ""
            linker: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary_suffix: ""
            linker: aarch64-linux-gnu-gcc
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_suffix: ""
            linker: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_suffix: ""
            linker: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_suffix: .exe
            linker: ""

    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: ${{ matrix.target }}
      - name: Install aarch64 Linux cross-linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build release binary
        run: cargo build --release --target "${{ matrix.target }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kalos-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/kalos${{ matrix.binary_suffix }}
          if-no-files-found: error
